
name: Build WordQuiz APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'wordquiz-estratto/wordquiz-android/**'
      - '.github/workflows/build-wordquiz-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        working-directory: wordquiz-estratto/wordquiz-android
        run: npm install

      - name: Prepare Android platform
        working-directory: wordquiz-estratto/wordquiz-android
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        working-directory: wordquiz-estratto/wordquiz-android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: wordquiz-estratto/wordquiz-android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WordQuiz-debug-APK
          path: wordquiz-estratto/wordquiz-android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
