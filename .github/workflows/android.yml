name: Build WordQuiz Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: wordquiz-estratto/wordquiz-android/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        working-directory: wordquiz-estratto/wordquiz-android
        run: npm ci

      - name: Add Android platform
        working-directory: wordquiz-estratto/wordquiz-android
        run: npx cap add android

      - name: Sync Android project
        working-directory: wordquiz-estratto/wordquiz-android
        run: npx cap sync android

      - name: Build APK
        working-directory: wordquiz-estratto/wordquiz-android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WordQuiz-APK
          path: wordquiz-estratto/wordquiz-android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
