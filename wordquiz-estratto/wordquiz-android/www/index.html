<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6fed">
<title>WordQuiz</title>

<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #f6f5f1;
  --card: #fff;
  --tx: #1f2328;
  --mu: #6b7280;
  --ac: #2f6fed;
  --ok: #1a8a4a;
  --ko: #c6362c;
  --bd: #dcdad2;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17181b;
    --card: #222428;
    --tx: #ececec;
    --mu: #9aa0a8;
    --ac: #6b9bff;
    --ok: #4cc27f;
    --ko: #f07167;
    --bd: #383b41;
  }
}

:root[data-theme="dark"] {
  --bg: #17181b;
  --card: #222428;
  --tx: #ececec;
  --mu: #9aa0a8;
  --ac: #6b9bff;
  --ok: #4cc27f;
  --ko: #f07167;
  --bd: #383b41;
}

* { box-sizing: border-box; }

html {
  scroll-padding-top: env(safe-area-inset-top, 0px);
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--tx);
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}

main {
  max-width: 760px;
  margin: 0 auto;
  padding: 12px;
}

h1 {
  font-size: 1.25rem;
  margin: 4px 0 10px;
}

button, select, input, textarea {
  font: inherit;
  color: inherit;
}

button {
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 10px;
  padding: 10px 12px;
  cursor: pointer;
  min-height: 42px;
}

button.on, button.pri {
  background: var(--ac);
  color: #fff;
  border-color: var(--ac);
}

input, select, textarea {
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 8px;
  padding: 10px;
  width: 100%;
  resize: vertical;
}

.card {
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 14px;
  padding: 12px;
  margin-bottom: 10px;
}

.row {
  display: grid;
  grid-template-columns: 1fr;
  gap: 8px;
}

@media (min-width: 560px) {
  .row { grid-template-columns: 1fr 1fr; }
  .full { grid-column: 1 / -1; }
}

.tools {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
  margin-top: 8px;
}

nav {
  display: flex;
  gap: 6px;
  margin: 10px 0;
}

nav button { flex: 1; }

.n {
  color: var(--mu);
  font-size: .8rem;
}

label.f {
  font-size: .8rem;
  color: var(--mu);
}

img.th {
  width: 56px;
  height: 56px;
  object-fit: cover;
  border-radius: 8px;
  border: 1px solid var(--bd);
}

.big {
  font-size: 1.3rem;
  margin: 10px 0;
  text-align: center;
}

.q img {
  display: block;
  max-width: 100%;
  max-height: 210px;
  margin: 8px auto;
  border-radius: 12px;
}

.opts {
  display: grid;
  gap: 8px;
  margin-top: 10px;
}

.ok { color: var(--ok); font-weight: 600; }
.ko { color: var(--ko); font-weight: 600; }
.opts button.ok { border-color: var(--ok); }
.opts button.ko { border-color: var(--ko); }
.hide { display: none; }
</style>
</head>

<body>
<main>
<h1>📚 WordQuiz</h1>

<div class="card">
  <div class="row">
    <div>
      <label class="f">Gruppo (es. Giorno 1)</label>
      <select id="grp"></select>
    </div>

    <div>
      <label class="f">Lingua della voce automatica</label>
      <select id="lang">
        <option value="en-GB">Inglese britannico (Regno Unito)</option>
        <option value="en-US">Inglese americano (Stati Uniti)</option>
        <option value="es-ES">Spagnolo</option>
        <option value="fr-FR">Francese</option>
        <option value="de-DE">Tedesco</option>
        <option value="it-IT">Italiano</option>
      </select>
    </div>
  </div>

  <div class="tools">
    <button id="gnew">＋ Nuovo</button>
    <button id="gren">Rinomina</button>
    <button id="gdel">Elimina</button>
  </div>

  <div class="tools">
    <button id="exp">⬇ Backup</button>
    <button id="imp">⬆ Ripristina</button>
    <input id="impf" type="file" accept=".json" class="hide">
  </div>
</div>

<nav>
  <button id="t0" class="on">Elenco</button>
  <button id="t1">Cloze</button>
  <button id="t2">Test</button>
</nav>

<section id="p0">
  <div id="list"></div>
</section>

<section id="p1" class="hide">
  <div class="card">
    <label class="f">Esercizio su</label>
    <select id="cscope">
      <option value="g">Questo gruppo</option>
      <option value="all">Tutti i gruppi</option>
    </select>
    <div class="tools">
      <button class="pri" id="cstart">Inizia</button>
    </div>
  </div>
  <div class="card q hide" id="cz"></div>
</section>

<section id="p2" class="hide">
  <div class="card" id="tcfg">
    <div class="row">
      <div>
        <label class="f">Su</label>
        <select id="tscope">
          <option value="g">Questo gruppo</option>
          <option value="all">Tutti i gruppi</option>
        </select>
      </div>

      <div>
        <label class="f">Direzione</label>
        <select id="dir">
          <option value="0">Parola/frase → traduzione</option>
          <option value="1">Traduzione → parola/frase</option>
        </select>
      </div>

      <div>
        <label class="f">Risposta</label>
        <select id="tm">
          <option value="c">Scelta multipla</option>
          <option value="w">Scrittura</option>
        </select>
      </div>
    </div>

    <div class="tools">
      <button class="pri" id="tstart">Inizia il test</button>
    </div>
  </div>

  <div class="card q hide" id="tq"></div>
</section>
</main>

<script>
const $ = id => document.getElementById(id);
const PER = 25;

/* Database locale */
const dbp = new Promise((res, rej) => {
  const q = indexedDB.open('wordquiz', 1);

  q.onupgradeneeded = () => {
    const d = q.result;
    d.createObjectStore('groups', {
      keyPath: 'id',
      autoIncrement: true
    });

    d.createObjectStore('items', {
      keyPath: 'id',
      autoIncrement: true
    }).createIndex('gid', 'gid');
  };

  q.onsuccess = () => res(q.result);
  q.onerror = () => rej(q.error);
});

const tx = (st, mode, fn) => dbp.then(d => new Promise((res, rej) => {
  const t = d.transaction(st, mode);
  const r = fn(t.objectStore(st));
  t.oncomplete = () => res(r && r.result);
  t.onerror = () => rej(t.error);
}));

try {
  navigator.storage &&
  navigator.storage.persist &&
  navigator.storage.persist();
} catch (e) {}

const norm = s => String(s || '')
  .toLowerCase()
  .normalize('NFD')
  .replace(/[\u0300-\u036f]/g, '')
  .replace(/[^\p{L}\p{N} ]/gu, '')
  .replace(/\s+/g, ' ')
  .trim();

const shuf = a => {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.random() * (i + 1) | 0;
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({
  '&': '&amp;',
  '<': '&lt;',
  '>': '&gt;',
  '"': '&quot;'
}[c]));

let groups = [];
let gid = null;
let items = [];
let all = [];

const saveItem = r => {
  const { lang, gname, ...o } = r;
  return tx('items', 'readwrite', s => s.put(o));
};

async function newGroup(name, lang = 'en-GB') {
  const id = await tx('groups', 'readwrite', s =>
    s.add({ name, lang })
  );

  await tx('items', 'readwrite', s => {
    for (let i = 0; i < PER; i++) {
      s.add({
        gid: id,
        n: i,
        w: '',
        ipa: '',
        t: '',
        s: '',
        img: '',
        aud: ''
      });
    }
  });

  return id;
}

/* AUDIO: preferisce la voce britannica en-GB */
function speakText(r) {
  const text = String(r.w || '').trim();

  if (!text) {
    alert('Inserisci prima una parola o una frase inglese.');
    return;
  }

  const synth = window.speechSynthesis;
  const Utterance = window.SpeechSynthesisUtterance;

  if (!synth || !Utterance) {
    alert(
      'La sintesi vocale non è disponibile in questa WebView. ' +
      'Controlla le impostazioni di sintesi vocale di Android ' +
      'e prova ad aggiornare Android System WebView.'
    );
    return;
  }

  synth.cancel();

  const wanted = ($('lang').value || r.lang || 'en-GB').toLowerCase();
  const u = new Utterance(text);

  u.lang = wanted;
  u.rate = 0.85;
  u.pitch = 1;
  u.volume = 1;

  let started = false;

  const speak = () => {
    if (started) return;
    started = true;

    const voices = synth.getVoices() || [];

    const exact = voices.filter(v =>
      v.lang && v.lang.toLowerCase() === wanted
    );

    const sameLanguage = voices.filter(v =>
      v.lang &&
      v.lang.toLowerCase().startsWith(wanted.split('-')[0])
    );

    const choices = exact.length ? exact : sameLanguage;

    if (choices.length) {
      const preferred = choices.find(v =>
        /female|libby|sonia|kate|serena|daniel|oliver/i.test(v.name)
      );

      u.voice = preferred || choices[0];
      u.lang = u.voice.lang || wanted;
    }

    try {
      synth.speak(u);
    } catch (e) {
      alert('Non riesco ad avviare la voce. Controlla le impostazioni vocali di Android.');
    }
  };

  if (synth.getVoices().length) {
    speak();
  } else {
    const ready = () => {
      synth.removeEventListener('voiceschanged', ready);
      speak();
    };

    synth.addEventListener('voiceschanged', ready);

    /* Alcuni dispositivi non inviano voiceschanged */
    setTimeout(speak, 1500);
  }
}

function play(r) {
  if (r.aud) {
    const audio = new Audio(r.aud);

    audio.play().catch(() => {
      speakText(r);
    });

    return;
  }

  speakText(r);
}

/* Navigazione */
['t0', 't1', 't2'].forEach((id, i) => {
  $(id).onclick = () => {
    [0, 1, 2].forEach(k => {
      $('p' + k).classList.toggle('hide', k !== i);
      $('t' + k).classList.toggle('on', k === i);
    });
  };
});

/* Gruppi */
async function refreshGroupSelect() {
  groups = await tx('groups', 'readonly', s => s.getAll());
  all = await tx('items', 'readonly', s => s.getAll());

  $('grp').innerHTML = groups.map(g =>
    `<option value="${g.id}">${esc(g.name)} (${all.filter(x =>
      x.gid === g.id && x.w.trim()
    ).length}/${PER})</option>`
  ).join('');

  $('grp').value = gid;
}

async function loadGroups(sel) {
  groups = await tx('groups', 'readonly', s => s.getAll());

  if (!groups.length) {
    return loadGroups(await newGroup('Giorno 1', 'en-GB'));
  }

  gid = sel || gid;

  if (!groups.find(g => g.id == gid)) {
    gid = groups[0].id;
  }

  await refreshGroupSelect();

  const g = groups.find(g => g.id == gid);
  $('lang').value = g.lang || 'en-GB';

  items = (await tx('items', 'readonly', s =>
    s.index('gid').getAll(gid)
  )).sort((a, b) => a.n - b.n);

  items.forEach(r => r.lang = g.lang || 'en-GB');
  renderList();
}

$('grp').onchange = e => loadGroups(+e.target.value);

$('lang').onchange = async e => {
  const g = groups.find(g => g.id == gid);
  if (!g) return;

  g.lang = e.target.value;

  await tx('groups', 'readwrite', s => s.put(g));
  items.forEach(r => r.lang = g.lang);
};

$('gnew').onclick = async () => {
  const name = prompt('Nome del nuovo gruppo:', 'Giorno ' + (groups.length + 1));
  if (!name) return;

  loadGroups(await newGroup(name, $('lang').value || 'en-GB'));
};

$('gren').onclick = async () => {
  const g = groups.find(g => g.id == gid);
  const name = prompt('Nuovo nome:', g.name);
  if (!name) return;

  g.name = name;
  await tx('groups', 'readwrite', s => s.put(g));
  loadGroups(gid);
};

$('gdel').onclick = async () => {
  if (!confirm('Eliminare questo gruppo e tutte le sue 25 righe?')) return;

  const d = await dbp;

  await new Promise(res => {
    const t = d.transaction(['groups', 'items'], 'readwrite');
    t.objectStore('groups').delete(gid);

    t.objectStore('items')
      .index('gid')
      .openCursor(IDBKeyRange.only(gid)).onsuccess = e => {
        const c = e.target.result;
        if (c) {
          c.delete();
          c.continue();
        }
      };

    t.oncomplete = res;
  });

  gid = null;
  loadGroups();
};

/* Backup e ripristino */
$('exp').onclick = async () => {
  const data = {
    groups: await tx('groups', 'readonly', s => s.getAll()),
    items: await tx('items', 'readonly', s => s.getAll())
  };

  const a = document.createElement('a');
  a.href = URL.createObjectURL(
    new Blob([JSON.stringify(data)], { type: 'application/json' })
  );
  a.download = 'wordquiz-backup.json';
  a.click();
};

$('imp').onclick = () => $('impf').click();

$('impf').onchange = e => {
  const f = e.target.files[0];
  if (!f) return;

  const fr = new FileReader();

  fr.onload = async () => {
    try {
      const d = JSON.parse(fr.result);

      if (!d.groups || !d.items) throw new Error('Backup non valido');

      if (!confirm('Il ripristino sostituisce tutti i dati attuali. Continuare?')) {
        return;
      }

      await tx('groups', 'readwrite', s => s.clear());
      await tx('items', 'readwrite', s => s.clear());

      await tx('groups', 'readwrite', s => {
        d.groups.forEach(g => s.put(g));
      });

      await tx('items', 'readwrite', s => {
        d.items.forEach(i => s.put(i));
      });

      gid = null;
      loadGroups();
    } catch (x) {
      alert('File di backup non valido.');
    }
  };

  fr.readAsText(f);
};

/* Elenco delle parole */
let rec = null;

async function toggleRec(r, btn) {
  if (rec) {
    rec.stop();
    return;
  }

  try {
    const st = await navigator.mediaDevices.getUserMedia({ audio: true });
    const mr = new MediaRecorder(st);
    const ch = [];

    mr.ondataavailable = e => ch.push(e.data);

    mr.onstop = () => {
      st.getTracks().forEach(t => t.stop());
      rec = null;

      const fr = new FileReader();

      fr.onload = async () => {
        r.aud = fr.result;
        await saveItem(r);
        renderList();
      };

      fr.readAsDataURL(new Blob(ch, { type: mr.mimeType }));
    };

    mr.start();
    rec = mr;
    btn.textContent = '⏹ Stop';
    btn.classList.add('pri');
  } catch (e) {
    alert('Microfono non disponibile: usa il pulsante Audio per scegliere un file.');
  }
}

function renderList() {
  $('list').innerHTML = '';

  items.forEach((r, i) => {
    const c = document.createElement('div');
    c.className = 'card';

    c.innerHTML = `
      <div class="n">${i + 1}</div>
      <div class="row">
        <textarea data-k="w" rows="2" placeholder="Parola o frase in inglese"></textarea>
        <textarea data-k="t" rows="2" placeholder="Traduzione"></textarea>
        <input data-k="ipa" class="full" placeholder="Trascrizione fonetica IPA, es. /həˈləʊ/">
        <input data-k="s" class="full" placeholder="Frase d'esempio (facoltativa, per il Cloze)">
      </div>
      <div class="tools">
        ${r.img ? `<img class="th" src="${r.img}" alt="Immagine">` : ''}
        <button data-a="img">🖼 Immagine</button>
        ${r.img ? '<button data-a="rimg">✕</button>' : ''}
        <button data-a="aud">🎵 Audio</button>
        <button data-a="rec">🎤 Registra</button>
        ${r.aud ? '<span class="ok">✓</span><button data-a="raud">✕</button>' : ''}
        <button data-a="play">▶ Ascolta</button>
        <input type="file" class="hide" data-f="img" accept="image/*">
        <input type="file" class="hide" data-f="aud" accept="audio/*">
      </div>
    `;

    c.querySelectorAll('[data-k]').forEach(el => {
      el.value = r[el.dataset.k] || '';
      let tm;

      el.oninput = () => {
        r[el.dataset.k] = el.value;
        clearTimeout(tm);
        tm = setTimeout(() => saveItem(r), 400);
      };

      el.onchange = () => {
        saveItem(r).then(refreshGroupSelect);
      };
    });

    c.querySelectorAll('button[data-a]').forEach(b => {
      b.onclick = async () => {
        const a = b.dataset.a;

        if (a === 'img' || a === 'aud') {
          c.querySelector(`[data-f="${a}"]`).click();
        } else if (a === 'rec') {
          toggleRec(r, b);
        } else if (a === 'rimg') {
          r.img = '';
          await saveItem(r);
          renderList();
        } else if (a === 'raud') {
          r.aud = '';
          await saveItem(r);
          renderList();
        } else {
          play(r);
        }
      };
    });

    c.querySelector('[data-f="img"]').onchange = e =>
      loadImg(e.target.files[0], r);

    c.querySelector('[data-f="aud"]').onchange = e =>
      loadAud(e.target.files[0], r);

    $('list').appendChild(c);
  });
}

function loadImg(f, r) {
  if (!f) return;

  const fr = new FileReader();

  fr.onload = () => {
    const im = new Image();

    im.onload = async () => {
      const k = Math.min(1, 480 / Math.max(im.width, im.height));
      const cv = document.createElement('canvas');

      cv.width = im.width * k;
      cv.height = im.height * k;

      cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
      r.img = cv.toDataURL('image/jpeg', .8);

      await saveItem(r);
      renderList();
    };

    im.src = fr.result;
  };

  fr.readAsDataURL(f);
}

function loadAud(f, r) {
  if (!f) return;

  if (f.size > 8e6) {
    alert('Audio troppo grande: massimo 8 MB.');
    return;
  }

  const fr = new FileReader();

  fr.onload = async () => {
    r.aud = fr.result;
    await saveItem(r);
    renderList();
  };

  fr.readAsDataURL(f);
}

async function pool(sc) {
  const its = await tx('items', 'readonly', s => s.getAll());
  const gs = await tx('groups', 'readonly', s => s.getAll());

  return its
    .filter(r => sc === 'all' || r.gid === gid)
    .map(r => ({
      ...r,
      lang: (gs.find(g => g.id === r.gid) || {}).lang || 'en-GB'
    }));
}

/* Esercizio Cloze */
function clozeOf(r) {
  const w = r.w.trim();
  const s = r.s.trim();

  if (w && s) {
    const at = s.toLowerCase().indexOf(w.toLowerCase());

    if (at >= 0) {
      return {
        pre: s.slice(0, at),
        ans: w,
        post: s.slice(at + w.length)
      };
    }
  }

  const src = s || w;
  const m = [...src.matchAll(/\p{L}[\p{L}'’]*/gu)]
    .filter(x => x[0].length > 2);

  if (m.length < 2) return null;

  const x = m[Math.random() * m.length | 0];

  return {
    pre: src.slice(0, x.index),
    ans: x[0],
    post: src.slice(x.index + x[0].length)
  };
}

let cl = { list: [], i: 0, sc: 0 };

$('cstart').onclick = async () => {
  const a = await pool($('cscope').value);

  cl = {
    list: shuf(a.map(r => ({ r, c: clozeOf(r) })).filter(x => x.c)),
    i: 0,
    sc: 0
  };

  $('cz').classList.remove('hide');
  renderCloze();
};

function renderCloze() {
  const el = $('cz');

  if (!cl.list.length) {
    el.innerHTML = '<p>Nessuna riga adatta. Servono frasi di almeno due parole o una frase d’esempio.</p>';
    return;
  }

  if (cl.i >= cl.list.length) {
    el.innerHTML = `
      <div class="big">Punteggio: ${cl.sc} / ${cl.list.length}</div>
      <div class="tools" style="justify-content:center">
        <button class="pri" id="again">Ricomincia</button>
      </div>
    `;

    $('again').onclick = () => $('cstart').click();
    return;
  }

  const { r, c } = cl.list[cl.i];

  el.innerHTML = `
    <div class="n">${cl.i + 1} / ${cl.list.length}</div>
    ${r.img ? `<img src="${r.img}" alt="Immagine">` : ''}
    <div class="big">${esc(c.pre)}<b>＿＿＿＿＿</b>${esc(c.post)}</div>
    ${r.t ? `<div class="n" style="text-align:center">Traduzione: ${esc(r.t)}</div>` : ''}
    <div class="tools">
      <input id="ca" placeholder="Parola mancante" autocomplete="off" autocapitalize="off">
      <button id="cp">▶ Ascolta</button>
      <button class="pri" id="cb">Verifica</button>
    </div>
    <div id="cf" class="big"></div>
  `;

  $('cp').onclick = () => play(r);

  const inp = $('ca');
  inp.focus();

  let done = false;

  const go = () => {
    if (done) {
      cl.i++;
      renderCloze();
      return;
    }

    done = true;

    const g = norm(inp.value) === norm(c.ans);

  };

  $('cb').onclick = go;
  inp.onkeydown = e => {
    if (e.key === 'Enter') go();
  };
