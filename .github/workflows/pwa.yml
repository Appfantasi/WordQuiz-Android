
name: Publish WordQuiz PWA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "wordquiz-estratto/wordquiz-android/www/**"
      - ".github/workflows/pwa.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate PWA files
        run: |
          test -f wordquiz-estratto/wordquiz-android/www/index.html
          test -f wordquiz-estratto/wordquiz-android/www/manifest.webmanifest
          test -f wordquiz-estratto/wordquiz-android/www/service-worker.js
          test -f wordquiz-estratto/wordquiz-android/www/icon.svg

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload PWA files
        uses: actions/upload-pages-artifact@v4
        with:
          path: wordquiz-estratto/wordquiz-android/www

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
