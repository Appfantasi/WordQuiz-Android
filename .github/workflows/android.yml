name: Build WordQuiz Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          cache-dependency-path: wordquiz-estratto/wordquiz-android/package-lock.json
          node-version: 22
          cache: npm

      - name: Install dependencies
        working-directory: wordquiz-estratto/wordquiz-android
        run: npm ci

      - name: Sync web app to Android
        working-directory: wordquiz-estratto/wordquiz-android
        run: npx cap sync android

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build debug APK
        working-directory: wordquiz-estratto/wordquiz-android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WordQuiz-debug-APK
          path: wordquiz-estratto/wordquiz-android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
